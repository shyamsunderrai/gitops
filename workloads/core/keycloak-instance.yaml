apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  annotations: 
    rgocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  db:
    vendor: postgres
    host: postgres
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    tlsSecret: "" # Let OpenShift handle TLS termination via the Route
  unsupported:
    podTemplate:
      spec:
        containers:
          - env:
            - name: JDK_JAVA_OPTIONS
              value: "-XX:UseSVE=0"
