apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak-route
  namespace: keycloak
spec:
  host: keycloak-route-keycloak.apps-crc.testing
  to:
    kind: Service
    name: keycloak-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
